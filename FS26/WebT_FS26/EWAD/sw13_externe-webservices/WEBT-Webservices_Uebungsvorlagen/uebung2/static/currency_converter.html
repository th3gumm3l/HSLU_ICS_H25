<!DOCTYPE html>
<html>

<head>
    <meta charset="utf8">
    <title>Übung 2: Währungsumrechnung</title>
    <style>
        .input { margin: 10pt; }
    </style>
    <script>
        async function convert() {
            // TODO: obtain access key (free plan) from https://www.exchangeratesapi.io
            const accessKey = "YOUR_ACCESS_KEY_HERE";

            // Extract amount and currency from HTML
            const toCurrency = document.getElementById("to").value;
            const number = document.getElementById('number').value;

            // Create URL to external web service
            // Note: the free plan only supports HTTP (not HTTPS) and the base currency is locked to EUR.
            const url = `http://api.exchangeratesapi.io/v1/latest?access_key=${accessKey}&symbols=${toCurrency}&base=EUR`;
            try {
                const response = await fetch(url, {
                    method: 'GET',
                    signal: AbortSignal.timeout(10000)
                });

                if (response.ok) {
                    const responseText = await response.text();
                    const body = JSON.parse(responseText);
                    // Obtain rate, calculate new amount (rate * amount) and display in HTML
                    if (body.success === false) {
                        throw Error(body.error?.info || 'API returned an error');
                    }
                    const rate = body.rates[toCurrency];
                    const converted = rate * Number(number);
                    document.getElementById('result').textContent =
                        `${converted.toFixed(2)} ${toCurrency} (Kurs: 1 EUR = ${rate} ${toCurrency})`;
                } else {
                    throw Error(`request did not error success code ${response.status}`);
                }
            } catch (error) {
                alert('Request failed: ' + error.message);
            }
        }
    </script>
</head>

<body>
    <h1>Übung 2: Währungsumrechnung</h1>
    <label for="amount">Betrag:</label> <input class="input" id="number" name="amount" type="number" /><br>
    <p>Quellwährung: EUR</p>
    <label name="to">Zielwährung:</label> <select class="input" id="to" name="to">
        <option value="GBP">British Pound</option>
        <option value="USD">Dollar</option>
        <option value="EUR">Euro</option>
        <option value="CHF">Swiss Franc</option>
    </select><br>
    <button onclick="convert()">Umrechnen</button>
    <p>Umgerechneter Betrag: <span id="result"></span></p>
</body>

</html>
