<!DOCTYPE html>
<html>

<head>
    <meta charset="utf8">
    <title>Übung 1: Hello Vue!</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3"></script>
</head>

<body>
    <main id="app">
        <button v-on:click="message='Hello Vue!'">Show greetings</button>

        <p id="output">{{ message }}</p>
    </main>
    <script>
        Vue.createApp({
            data() {
                return {
                    message: ''
                }
            }
        }).mount('#app');
    </script>
</body>

</html>
