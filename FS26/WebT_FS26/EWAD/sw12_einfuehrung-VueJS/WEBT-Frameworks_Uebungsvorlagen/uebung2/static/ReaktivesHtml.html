<!DOCTYPE html>
<html>

<head>
    <meta charset="utf8">
    <title>Übung 2: Reaktives HTML mit vue.js</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3"></script>
</head>

<body>
    <main id="main">
        <label for="name">Bitte Namen eingaben:</label>

        <input id="name" v-model="name">

        <p id="output">Hallo {{ name }}</p>

    </main>
    <script>
        Vue.createApp({
            data() {
                return {
                    name: ''
                }
            }
        }).mount('#main');
    </script>
</body>

</html>
